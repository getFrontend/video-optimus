<svg xmlns="http://www.w3.org/2000/svg" class="logo-svg" width="236" height="56" viewBox="0 0 236 56" role="img" aria-labelledby="title description">
  <title id="title">Video Optimus</title>
  <desc id="description">A folded frame resolves into the Video Optimus wordmark.</desc>
  <style>
    :root {
      --vo-ink: #25242d;
      --vo-accent: #5846c8;
      --vo-muted: #62606b;
    }
    .mark-fill { fill: var(--vo-accent); }
    .source-frames {
      fill: none;
      stroke: var(--vo-accent);
      stroke-linecap: square;
      stroke-linejoin: miter;
      stroke-width: 1.7;
      opacity: 0;
      animation: converge 1.35s cubic-bezier(.77, 0, .175, 1) .08s both;
    }
    .final-mark {
      opacity: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: resolve 1.05s cubic-bezier(.23, 1, .32, 1) .98s both;
    }
    .mark-hover {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 180ms cubic-bezier(.23, 1, .32, 1);
    }
    .core-spark { fill: var(--vo-ink); }
    .wordmark {
      opacity: 1;
      transform-box: fill-box;
      transform-origin: left center;
      animation: reveal-wordmark .72s cubic-bezier(.23, 1, .32, 1) 1.72s both;
    }
    .wordmark-main {
      fill: var(--vo-ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -.8px;
    }
    .wordmark-light {
      fill: var(--vo-muted);
      font-weight: 460;
    }
    .idle-enabled .core-spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: quiet-core 7s ease-in-out 2.8s infinite;
    }
    @keyframes converge {
      0% { opacity: 0; transform: translateX(-10px) scaleX(.94); }
      18% { opacity: .9; }
      72% { opacity: .62; transform: translateX(2px) scaleX(1); }
      100% { opacity: 0; transform: translateX(5px); }
    }
    @keyframes resolve {
      0% { opacity: 0; transform: translateX(-3px) scale(.94); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes reveal-wordmark {
      0% { opacity: 0; transform: translateX(-5px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes quiet-core {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .78; transform: scale(.94); }
    }
    @media (hover: hover) and (pointer: fine) {
      .logo-svg:hover .mark-hover {
        transform: translateY(-.5px) scale(1.015);
        transition: transform 180ms cubic-bezier(.23, 1, .32, 1);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-svg * { animation: none !important; transition: none !important; }
      .source-frames { display: none; }
      .final-mark, .wordmark { opacity: 1; transform: none; }
    }
  </style>
  <g class="source-frames" aria-hidden="true">
    <path d="M3 16v-5h9l12 12" />
    <path d="M3 28h16" />
    <path d="M3 40v5h9l12-12" />
  </g>
  <g class="final-mark" aria-hidden="true">
    <g class="mark-hover">
      <path class="mark-fill" d="M8 9h12l16 16-6 6-13-13H8z" />
      <path class="mark-fill" d="M8 47h12l16-16-6-6-13 13H8z" />
      <path class="core-spark" d="m21 25 3 3-3 3-3-3z" />
    </g>
  </g>
  <g class="wordmark">
    <text class="wordmark-main" x="64" y="36">
      <tspan>video</tspan><tspan class="wordmark-light">optimus</tspan>
    </text>
  </g>
</svg>
