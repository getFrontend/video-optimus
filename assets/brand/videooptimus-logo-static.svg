<svg xmlns="http://www.w3.org/2000/svg" class="logo-svg" width="236" height="56" viewBox="0 0 236 56" role="img" aria-labelledby="title description">
  <title id="title">Video Optimus</title>
  <desc id="description">A folded frame symbol beside the Video Optimus wordmark.</desc>
  <style>
    :root {
      --vo-ink: #25242d;
      --vo-accent: #5846c8;
      --vo-muted: #62606b;
    }
    .mark-fill { fill: var(--vo-accent); }
    .core-spark { fill: var(--vo-ink); }
    .wordmark-main {
      fill: var(--vo-ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -.8px;
    }
    .wordmark-light { fill: var(--vo-muted); font-weight: 460; }
    @media (hover: hover) and (pointer: fine) {
      .mark-fill {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 180ms cubic-bezier(.23, 1, .32, 1);
      }
      .logo-svg:hover .mark-fill {
        transform: translateY(-.5px);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-svg * { animation: none !important; transition: none !important; }
    }
  </style>
  <g class="mark-fill" aria-hidden="true">
    <path d="M8 9h12l16 16-6 6-13-13H8z" />
    <path d="M8 47h12l16-16-6-6-13 13H8z" />
    <path class="core-spark" d="m21 25 3 3-3 3-3-3z" />
  </g>
  <text class="wordmark-main" x="64" y="36">
    <tspan>video</tspan><tspan class="wordmark-light">optimus</tspan>
  </text>
</svg>
